name: "OQ-DHC / SLSA / SECURE / RELEASE / PIPELINE"

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      # ========================================================
      # Schritt 1: Struktur prüfen und Distributions-ZIP packen
      # ========================================================
      - name: "Build and Package OQ-DHC Core Assets"
        run: |
          echo "======================================================="
          echo "🏗️ Starte industrialisierten OQ-DHC Build"
          echo "======================================================="
          
          # Erstelle das Ausgabeverzeichnis für die Artefakte
          mkdir -p builddist
          
          # Verpacke die vorhandene gehärtete Kernel- und EDA-Struktur
          # Isoliere das Paket von unsauberen Git-Zwischenspeichern
          zip -r builddist/OQDHC-Core-Architecture.zip docs/ fpga/ kicad/ sdk/ src/ tests/ LICENSE README.md -x "*.git*"
          
          # Kopiere das Demovideo hinzu, falls vorhanden
          if [ -f "OQ_DHC_Project_Overview.mp4" ]; then
            cp OQ_DHC_Project_Overview.mp4 builddist/OQDHC-Project-Overview.mp4
          fi

          echo "✓ Build-Schritt abgeschlossen. Folgende Artefakte sind bereit:"
          ls -la builddist/

      # ========================================================
      # Schritt 2: Unbestechliche Krypto-Fingerabdrücke berechnen
      # ========================================================
      - name: "Generate Subjects for Provenance"
        id: hash
        run: |
          set -euo pipefail
          cd builddist

          # Berechne den SHA256-Hash aller generierten Distributionsdateien
          # Ausgabe wird in Base64 formatiert, wie von der Linux Foundation gefordert
          echo "hashes=$(sha256sum * | base64 -w0)" >> "${GITHUB_OUTPUT}"
          
          echo "✓ Krypto-Fingerabdrücke für SLSA erfolgreich bereitgestellt."

  # ========================================================
  # Schritt 3: Der offizielle OpenSSF SLSA-Level-3-Generator
  # ========================================================
  provenance:
    needs: [build]
    permissions:
      actions: read   # Erforderlich, um den Pfad des aufrufenden Workflows zu lesen
      id-token: write # Zwingend notwendig für OIDC-Signierung des Herkunftsnachweises
      contents: write # Erlaubt das automatische Anhängen des SLSA-Siegels ans Release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
